name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python suite + voice-quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (pesq C extension, libsndfile for soundfile)
        run: sudo apt-get update && sudo apt-get install -y python3-dev libsndfile1

      - name: Install Python dependencies
        # numpy + Cython first so the pesq C extension builds against them.
        run: |
          python -m pip install --upgrade pip wheel
          pip install numpy==2.5.4 Cython
          pip install -r requirements.txt

      - name: Run the full Python suite (includes the committed voice-quality gate)
        run: python -m pytest -q

  node:
    name: TypeScript packages + app bundle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (jest, incl. cross-language conformance)
        run: npm test
