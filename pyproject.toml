# Root config for the Python side of the monorepo (reference impls + emulator verifier).
# The on-device app and its TypeScript packages are configured under apps/ and packages/*/ts.
#
# The three package source roots expose one implicit-namespace package, `messenger`
# (PEP 420 — no messenger/__init__.py anywhere), so cross-package imports read naturally:
#   messenger.crypto.*   (packages/crypto/python)
#   messenger.protocol.* (packages/protocol/python)
#   messenger.transport.* (packages/transport/python)

[tool.pytest.ini_options]
minversion = "7.0"
# importlib mode keeps the namespace-package layout clean and lets same-named test files
# (e.g. test_envelope.py) coexist across packages without import collisions.
addopts = "-q --import-mode=importlib"
pythonpath = [
    "packages/crypto/python",
    "packages/protocol/python",
    "packages/transport/python",
    "emulation",
    "sim",
]
testpaths = [
    "packages/crypto/tests",
    "packages/protocol/tests",
    "packages/transport/tests",
    "tests",
    "sim/tests",
]
